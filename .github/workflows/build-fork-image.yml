name: Build fork image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag or SHA)
        required: true
        default: refactor/torrent-files-key
      tag:
        description: Image tag to publish
        required: true
        default: tfk

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Resolve revision
        id: src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and publish image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ci.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/storm-peter/bitmagnet:${{ inputs.tag }}
          build-args: |
            VERSION=${{ inputs.tag }}
            REVISION=${{ steps.src.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
